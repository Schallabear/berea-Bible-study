name: Deploy to GitHub Pages

on:
  push:
    # The github-pages environment only permits deployments from the
    # repository's default branch, which is currently this one. If the default
    # is ever changed to main, change this to match or the job is rejected
    # before it starts.
    branches: [claude/bible-study-app-ljt095]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # Turn Pages on, with Actions as the source, if it isn't already — rather
        # than depending on someone having flipped it in Settings first.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
